name: Source and portable tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check source and documentation
        run: python3 tools/check_repository.py
      - name: Install portable transport dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev
      - name: Configure without game assets
        run: cmake -S . -B build/ci -G Ninja -DARCMP_BUILD_GAME=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
